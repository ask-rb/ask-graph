plugins:
  - rubocop-rake
  - rubocop-minitest

AllCops:
  NewCops: enable
  TargetRubyVersion: 3.2
  Exclude:
    - vendor/**/*
    - gemfiles/**/*
  SuggestExtensions: false

Metrics/ClassLength:
  Max: 250
Metrics/AbcSize:
  Max: 50
Metrics/CyclomaticComplexity:
  Max: 20
Metrics/MethodLength:
  Max: 40
  CountAsOne:
    - array
    - hash
    - heredoc
Metrics/ModuleLength:
  Max: 250

Minitest/MultipleAssertions:
  Enabled: false
